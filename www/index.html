<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cranbero Website</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background-color: #ffffff;
    color: #000000;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  
  .main-wrapper {
    width: 100%;
    max-width: 800px;
  }

  /* Tab Bar */
  .tab-bar {
    border-bottom: 1px solid #ccc;
    margin-bottom: 20px;
    width: 100%;
  }
  .tab-link {
    display: inline-block;
    background: #f1f1f1;
    border: 1px solid #ccc;
    border-bottom: none;
    padding: 10px 20px;
    cursor: pointer;
    text-decoration: none;
    color: #000;
    font-size: 14px;
  }
  .tab-link.active {
    background: #ffffff;
    font-weight: bold;
  }

  /* Tab Content Sections */
  .tab-content {
    display: none;
  }
  .tab-content.active {
    display: block;
  }

  /* Version History Styles */
  .version-container {
    border: 1px solid #ccc;
    margin-bottom: 15px;
    border-radius: 4px;
    width: 100%;
  }
  .version-header {
    background-color: #f7f7f7;
    padding: 15px 20px;
    margin: 0;
    cursor: pointer;
    font-size: 20px;
    user-select: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .version-header:hover {
    background-color: #eee;
  }
  .version-header::after {
    content: '+';
    font-size: 22px;
    font-weight: bold;
  }
  .version-container.active .version-header::after {
    content: '-';
  }
  .version-content {
    display: none;
    padding: 20px;
    border-top: 1px solid #ccc;
    background-color: #fff;
    white-space: pre-line;
  }
  .version-container.active .version-content {
    display: block;
  }

  footer {
    width: 100%;
    max-width: 800px;
    margin-top: 50px;
    padding-top: 15px;
    border-top: 1px solid #ccc;
    font-size: 14px;
    color: #555;
  }
</style>
</head>
<body>

  <div class="main-wrapper">
    <!-- Tab Navigation Links -->
    <div class="tab-bar">
      <a href="#license" class="tab-link active" onclick="switchTab(event, 'license-tab')">License</a>
      <a href="#history" class="tab-link" onclick="switchTab(event, 'history-tab')">Past History</a>
    </div>

    <!-- License Tab Content -->
    <div id="license-tab" class="tab-content active">
      <h1>Cranbero License</h1>
      <p>This is the license information for Cranbero.</p>
    </div>

    <!-- Past History Tab Content -->
    <div id="history-tab" class="tab-content">
      <h1>Past History</h1>
      <p>This is the past history section.</p>

      <!-- Versions will be loaded here -->
      <div id="versions-list"></div>
    </div>

    <footer>
      Cranbero Open-Source website. Use license if needed. October, 2026
    </footer>
  </div>

  <script>
    // Tab switching function
    function switchTab(event, tabId) {
      event.preventDefault();

      // Update active link styles
      document.querySelectorAll('.tab-link').forEach(link => link.classList.remove('active'));
      event.currentTarget.classList.add('active');

      // Show/hide tab contents
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
    }

    // List the versions you want to load
    const versions = [
      "26.0.2",
      "26.0.3",
      "26.1.0"
    ];

    function toggleVersion(id) {
      const element = document.getElementById(id);
      element.classList.toggle('active');
    }

    async function loadVersions() {
      const container = document.getElementById('versions-list');

      for (const version of versions) {
        try {
          const response = await fetch(`versions/${version}.txt`);
          const content = await response.text();

          const id = "v" + version.replace(/\./g, "-");

          const html = `
            <div class="version-container" id="${id}">
              <h1 class="version-header" onclick="toggleVersion('${id}')">${version}</h1>
              <div class="version-content">
                ${content}
              </div>
            </div>
          `;

          container.innerHTML += html;
        } catch (err) {
          console.error("Failed to load version:", version);
        }
      }
    }

    loadVersions();
  </script>

</body>
</html>
