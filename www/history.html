<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cranbero Past History</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background-color: #ffffff;
    color: #000000;
  }
  
  .tab-bar {
    border-bottom: 1px solid #ccc;
    margin-bottom: 20px;
  }
  .tab-link {
    display: inline-block;
    background: #f1f1f1;
    border: 1px solid #ccc;
    border-bottom: none;
    padding: 10px 20px;
    cursor: pointer;
    text-decoration: none;
    color: #000;
    font-size: 14px;
  }
  .tab-link.active {
    background: #ffffff;
    font-weight: bold;
  }

  .version-container {
    border: 1px solid #ccc;
    margin-bottom: 15px;
    border-radius: 4px;
  }
  .version-header {
    background-color: #f7f7f7;
    padding: 15px 20px;
    margin: 0;
    cursor: pointer;
    font-size: 20px;
    user-select: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .version-header:hover {
    background-color: #eee;
  }
  .version-header::after {
    content: '+';
    font-size: 22px;
    font-weight: bold;
  }
  .version-container.active .version-header::after {
    content: '-';
  }
  .version-content {
    display: none;
    padding: 20px;
    border-top: 1px solid #ccc;
    background-color: #fff;
  }
  .version-container.active .version-content {
    display: block;
  }

  /* Every single line gets its own row with a bottom border */
  .version-line {
    padding: 10px 0;
    border-bottom: 1px solid #eaeaea;
    font-size: 14px;
    color: #333;
  }
  .version-line:last-child {
    border-bottom: none;
  }
</style>
</head>
<body>

  <div class="tab-bar">
    <a href="index.html" class="tab-link">License</a>
    <a href="history.html" class="tab-link active">Past History</a>
  </div>

  <h1>Past History</h1>
  <p>This is the past history section.</p>

  <!-- Versions will be loaded here -->
  <div id="versions-list"></div>

  <footer style="margin-top: 50px; padding-top: 15px; border-top: 1px solid #ccc; font-size: 14px; color: #555;">
    Cranbero Open-Source website. Use license if needed. October, 2026
  </footer>

  <script>
    const versions = [
      "26.0.2",
      "26.0.3"
    ];

    function toggleVersion(id) {
      const element = document.getElementById(id);
      element.classList.toggle('active');
    }

    async function loadVersions() {
      const container = document.getElementById('versions-list');

      for (let i = 0; i < versions.length; i++) {
        const version = versions[i];
        const id = "v" + version.replace(/\./g, "-");
        const isActive = i === 0 ? 'active' : '';

        let formattedContent = '';

        try {
          const response = await fetch(`versions/${version}.txt`);
          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

          const text = await response.text();
          
          // Split text file strictly by line breaks
          const lines = text.split(/\r?\n/);
          
          for (const line of lines) {
            if (line.trim() !== '') {
              // Wrap every single line in its own distinct row with a divider line
              formattedContent += `<div class="version-line">${line}</div>`;
            }
          }
        } catch (err) {
          console.error("Failed to load version:", version, err);
          formattedContent = `<div style="color: red;">Failed to load version file.</div>`;
        }

        const html = `
          <div class="version-container ${isActive}" id="${id}">
            <h2 class="version-header" onclick="toggleVersion('${id}')">${version}</h2>
            <div class="version-content">
              ${formattedContent}
            </div>
          </div>
        `;

        container.insertAdjacentHTML('beforeend', html);
      }
    }

    loadVersions();
  </script>

</body>
</html>
