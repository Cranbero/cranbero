<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cranbero Past History</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background-color: #ffffff;
    color: #000000;
  }
  
  .tab-bar {
    border-bottom: 1px solid #ccc;
    margin-bottom: 20px;
  }
  .tab-link {
    display: inline-block;
    background: #f1f1f1;
    border: 1px solid #ccc;
    border-bottom: none;
    padding: 10px 20px;
    cursor: pointer;
    text-decoration: none;
    color: #000;
    font-size: 14px;
  }
  .tab-link.active {
    background: #ffffff;
    font-weight: bold;
  }

  .version-container {
    border: 1px solid #ccc;
    margin-bottom: 15px;
    border-radius: 4px;
  }
  .version-header {
    background-color: #f7f7f7;
    padding: 15px 20px;
    margin: 0;
    cursor: pointer;
    font-size: 20px;
    user-select: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .version-header:hover {
    background-color: #eee;
  }
  .version-header::after {
    content: '+';
    font-size: 22px;
    font-weight: bold;
  }
  .version-container.active .version-header::after {
    content: '-';
  }
  .version-content {
    display: none;
    padding: 20px;
    border-top: 1px solid #ccc;
    background-color: #fff;
  }
  .version-container.active .version-content {
    display: block;
  }

  /* Specific styles for alternating lines */
  .version-title {
    font-weight: bold;
    font-size: 16px;
    margin-top: 15px;
    color: #333;
  }
  .version-title:first-child {
    margin-top: 0;
  }
  .version-desc {
    margin: 5px 0 15px 0;
    color: #666;
    line-height: 1.4;
  }
</style>
</head>
<body>

  <div class="tab-bar">
    <a href="index.html" class="tab-link">License</a>
    <a href="history.html" class="tab-link active">Past History</a>
  </div>

  <h1>Past History</h1>
  <p>This is the past history section.</p>

  <!-- Versions will be loaded here -->
  <div id="versions-list"></div>

  <footer style="margin-top: 50px; padding-top: 15px; border-top: 1px solid #ccc; font-size: 14px; color: #555;">
    Cranbero Open-Source website. Use license if needed. October, 2026
  </footer>

  <script>
    const versions = [
      "26.0.2",
      "26.0.3"
    ];

    function toggleVersion(id) {
      const element = document.getElementById(id);
      element.classList.toggle('active');
    }

    async function loadVersions() {
      const container = document.getElementById('versions-list');

      for (const version of versions) {
        try {
          const response = await fetch(`versions/${version}.txt`);
          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

          const text = await response.text();
          const lines = text.split(/\r?\n/);
          
          let formattedContent = '';
          for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            if (line !== '') {
              // Even lines (0, 2, 4...) become THING (Titles)
              // Odd lines (1, 3, 5...) become text in thing (Descriptions)
              if (i % 2 === 0) {
                formattedContent += `<div class="version-title">${line}</div>`;
              } else {
                formattedContent += `<div class="version-desc">${line}</div>`;
              }
            }
          }

          const id = "v" + version.replace(/\./g, "-");

          const html = `
            <div class="version-container" id="${id}">
              <h2 class="version-header" onclick="toggleVersion('${id}')">${version}</h2>
              <div class="version-content">
                ${formattedContent}
              </div>
            </div>
          `;

          container.insertAdjacentHTML('beforeend', html);
        } catch (err) {
          console.error("Failed to load version:", version, err);
        }
      }
    }

    loadVersions();
  </script>

</body>
</html>
